<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OS Desktop - Drag & Drop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="screen">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-bottom">
                <button id="editModeBtn" class="tab-btn" onclick="toggleEditMode()" title="Mode Édition"
                    style="background: rgba(255,165,0,0.8);"><i class="fas fa-pencil-ruler"></i></button>
                <button class="tab-btn" onclick="exportConfig()" title="Exporter pour la version Multi"
                    style="background: rgba(0,128,0,0.8);"><i class="fas fa-file-export"></i></button>
                <button class="tab-btn add-btn" onclick="openFileExplorer()" title="Fichiers Drive"
                    style="background: #4285f4;"><i class="fas fa-folder-open"></i></button>
                <button class="tab-btn add-btn" onclick="showModal()" title="Ajouter"><i
                        class="fas fa-plus"></i></button>
                <a href="https://mail.google.com" target="_blank" class="tab-btn gmail-btn" title="Gmail"><i
                        class="fas fa-envelope"></i></a>
                <button id="msAuthBtn" class="tab-btn" onclick="handleMsAuthClick()" title="Connexion Outlook"
                    style="background: #0078d4;"><i class="fab fa-microsoft"></i></button>
            </div>
        </nav>

        <main class="main-container">
            <div class="status-bar" style="position: relative;">
                <button id="authBtn" class="auth-btn disconnected" onclick="handleAuthClick()" title="Connexion Google"
                    style="width: fit-content; border:none; border-radius:20px; padding:6px 12px; cursor:pointer; display:flex; align-items:center; gap:8px;">
                    <i class="fab fa-google"></i> <span style="font-size: 13px;" id="authBtnText">Connexion</span>
                </button>
                <button id="serverBtn" class="auth-btn connected" onclick="restartServerPrompt()" title="Statut Serveur"
                    style="width: fit-content; border:none; border-radius:20px; padding:6px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; margin-left: 8px;">
                    <i class="fas fa-server"></i> <span style="font-size: 13px;" id="serverBtnText">Serveur en ligne</span>
                </button>

                <!-- VERSION NUMBER -->
                <div id="appVersion"
                    style="position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.3); pointer-events: none;">
                    vad1cd06
                </div>

                <div style="text-align: right;">
                    <div id="currentDate"
                        style="font-size: 14px; color: rgba(255,255,255,0.7); font-weight: normal; margin-bottom: 2px;">
                    </div>
                    <div id="clock" style="font-size: 24px; font-weight: 500;">00:00</div>
                </div>
            </div>

            <div id="pages-container"></div>
            
            <div class="search-section">
                <form action="https://www.google.com/search" method="GET" target="_blank" class="search-bar">
                    <i class="fab fa-google"></i>
                    <input type="text" name="q" placeholder="Rechercher sur Google..." autocomplete="off">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>

            <!-- Drawer Tabs on the right edge -->
            <div class="drawer-tabs">
                <div class="drawer-tab" id="tab-calendar" onclick="toggleDrawer('calendar')" title="Calendrier">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="drawer-tab" id="tab-email" onclick="toggleDrawer('email')" title="Emails">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="drawer-tab" id="tab-tools" onclick="toggleDrawer('tools')" title="Outils">
                    <i class="fas fa-tools"></i>
                </div>
            </div>

            <!-- Independent Drawers -->
            <div id="drawer-calendar" class="drawer-container">
                <div class="drawer-header">
                    <div class="drawer-title">Calendrier</div>
                    <div class="drawer-close" onclick="toggleDrawer('calendar')"><i class="fas fa-times"></i>
                    </div>
                </div>
                <div id="calendar-widget" class="calendar-widget"></div>
                <!-- Daily Agenda also inside the drawer -->
                <div id="daily-agenda-widget" class="daily-agenda" style="display:none;"></div>
            </div>

            <div id="drawer-email" class="drawer-container">
                <div class="drawer-header">
                    <div class="drawer-title">Emails</div>
                    <div class="drawer-close" onclick="toggleDrawer('email')"><i class="fas fa-times"></i></div>
                </div>
                <div id="gmail-widget"></div>
                <div id="outlook-emails-widget"></div>
            </div>

            <div id="drawer-tools" class="drawer-container">
                <div class="drawer-header">
                    <div class="drawer-title">Outils</div>
                    <div class="drawer-close" onclick="toggleDrawer('tools')"><i class="fas fa-times"></i></div>
                </div>
                <div id="tools-pinned-container" class="tools-container">
                    <!-- Les outils épinglés seront injectés ici -->
                </div>
            </div>

            <div id="group-modal-container"></div>
            </main>
        </div>

        <div id="addModal" class="modal">
            <div class="modal-content">
                <h2 style="margin:0 0 15px 0; font-size: 22px;">Nouvel Élément</h2>
                <select id="typeSelector" onchange="toggleInputs()">
                    <option value="link">Lien / Application</option>
                    <option value="page">Nouvelle Page / Onglet</option>
                    <option value="file">Fichier (Upload vers Drive)</option>
                </select>
                <input type="text" id="itemName" placeholder="Nom de l'élément">
                <input type="text" id="itemUrl" placeholder="URL (ex: https://...)">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <label style="font-size: 11px; color: #999;">Icône :</label>
                    <a href="https://fontawesome.com/search?m=free" target="_blank" class="helper-link">Trouver une
                        icône <i class="fas fa-external-link-alt"></i></a>
                </div>

                <div class="preview-box">
                    <div id="iconPreview" style="background:#4285f4"><i class="fas fa-globe"></i></div>
                    <div style="flex:1">
                        <input type="text" id="itemIcon" placeholder="ex: apple, house, star..."
                            oninput="updatePreview()" style="margin:0">
                    </div>
                </div>

                <div id="linkOnlyFields">
                    <div style="display:flex; gap:10px; align-items:center;">
                        <div style="flex:1">
                            <label style="font-size: 11px; color: #999;">Onglet :</label>
                            <select id="targetPage"></select>
                        </div>
                        <div style="flex:1">
                            <label style="font-size: 11px; color: #999;">Couleur :</label>
                            <input type="color" id="itemColor" value="#4285f4" oninput="updatePreview()">
                        </div>
                    </div>
                </div>

                <div id="fileUploadFields" style="display:none;">
                    <label style="font-size: 11px; color: #999;">Choisir un fichier à uploader :</label>
                    <input type="file" id="itemFile" style="background:#111; padding: 8px;">
                    <small style="color:#aaa; font-size:10px; display:block; margin-top: -5px;">Nécessite d'être
                        connecté à
                        Google.</small>
                </div>

                <button id="saveBtn" class="save-btn" onclick="saveItem()">Enregistrer</button>
                <button class="cancel-btn" onclick="hideModal()">Annuler</button>
            </div>
        </div>



        <div id="eventDetailModal" class="modal">
            <div class="modal-content">
                <h2 id="eventModalTitle" style="margin:0 0 15px 0; font-size: 22px;">Détails de l'événement</h2>

                <input type="text" id="editEventSummary" placeholder="Titre de l'événement">
                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label style="font-size: 11px; color: #999;">Début :</label>
                        <input type="datetime-local" id="editEventStart">
                    </div>
                    <div style="flex:1">
                        <label style="font-size: 11px; color: #999;">Fin :</label>
                        <input type="datetime-local" id="editEventEnd">
                    </div>
                </div>
                <input type="text" id="editEventLocation" placeholder="Lieu">
                <textarea id="editEventDescription" placeholder="Description"
                    style="width: 100%; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 14px; margin: 12px 0; font-family: inherit; outline: none; height: 100px;"></textarea>

                <div id="eventModalActions" style="display: flex; gap: 10px; margin-top: 20px;">
                    <button id="saveEventBtn" class="save-btn" style="margin-top:0;">Enregistrer</button>
                    <button id="outlookCreateBtn" class="save-btn"
                        style="margin-top:0; background: #0078d4; display: none;"><i class="fab fa-microsoft"></i> Créer
                        Outlook</button>
                    <button id="deleteEventBtn" class="save-btn"
                        style="margin-top:0; background: #f44336; box-shadow: 0 0 15px rgba(244, 67, 54, 0.4);">Supprimer</button>
                </div>
                <button class="cancel-btn" onclick="hideEventModal()" style="margin-top: 15px;">Fermer</button>
                <div id="outlookNotice"
                    style="display:none; color: #0078d4; font-size: 10px; margin-top: 10px; text-align: center;">
                    <i class="fab fa-microsoft"></i> Événement Outlook local (Lecture seule)
                </div>
            </div>
        </div>

        <div id="aiConfigModal" class="modal">
            <div class="modal-content">
                <h2 style="margin:0 0 15px 0; font-size: 22px;"><i class="fas fa-robot"></i> Config Gemini</h2>
                <p style="font-size: 11px; color: #999; margin-bottom: 20px;">
                    Entrez votre clé API Google AI Studio pour activer le chat.
                    <a href="https://aistudio.google.com/app/apikey" target="_blank"
                        style="color:var(--accent); text-decoration:none;">Obtenir une clé <i
                            class="fas fa-external-link-alt"></i></a>
                </p>
                <div class="config-item">
                    <label>Clé API Gemini</label>
                    <form onsubmit="event.preventDefault(); saveGeminiConfig();">
                        <input type="password" id="geminiApiKey" class="api-key-input" placeholder="Clé API (AI_...)">
                    </form>
                </div>
                <div style="margin-top:10px;">
                    <label style="font-size: 11px; color: #999;">Modèle :</label>
                    <select id="geminiModel">
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Fonds de quota)</option>
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>

                    </select>
                </div>
                <div style="margin-top:20px; display:flex; gap:10px;">
                    <button class="save-btn" style="margin:0;" onclick="saveGeminiConfig()">Enregistrer</button>
                    <button class="cancel-btn"
                        style="margin:0; background:rgba(234,67,53,0.1); color:#ea4335; border:1px solid rgba(234,67,53,0.2);"
                        onclick="clearAiHistory()"><i class="fas fa-trash"></i> Effacer l'historique</button>
                </div>
                <button class="cancel-btn" style="margin-top:15px;" onclick="hideAiConfig()">Annuler</button>
            </div>
        </div>

        <!-- EXPLORER MODAL (GDRIVE) -->
        <div class="modal" id="explorerModal">
            <div class="modal-content" style="width: 800px; max-width: 90vw;">
                <h2 style="margin-top: 0; color: var(--accent); border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        Vos Fichiers (Drive)
                        <a id="driveLink" href="#" target="_blank" style="font-size: 12px; color: #888; text-decoration: none;" title="Ouvrir dans Google Drive"><i class="fas fa-external-link-alt"></i> Ouvrir</a>
                    </div>
                    <button onclick="closeFileExplorer()" style="background: transparent; border: none; color: #fff; cursor: pointer; font-size: 20px; width: auto; padding: 0; margin: 0;"><i class="fas fa-times"></i></button>
                </h2>
                <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
                    <input type="text" id="explorerSearch" placeholder="Rechercher des fichiers..." onkeyup="filterExplorerFiles()" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: #fff; margin: 0;">
                    <button onclick="loadExplorerFiles()" style="width: auto; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; margin: 0;" title="Actualiser"><i class="fas fa-sync-alt"></i></button>
                    <button onclick="document.getElementById('explorerUploadInput').click()" style="width: auto; padding: 10px 15px; background: var(--accent); color: #000; border-radius: 8px; margin: 0; font-weight: bold; border: none;">
                        <i class="fas fa-upload"></i> Charger
                    </button>
                    <input type="file" id="explorerUploadInput" style="display: none;" onchange="handleExplorerUpload(event)">
                </div>
                
                <div style="overflow-y: auto; max-height: 500px; padding: 10px;">
                    <div id="gdriveFileList" style="display: flex; flex-direction: column; gap: 10px; min-height: 50px;">
                        <!-- Files rendered as cards here -->
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
